name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 网关 + 登录 CLI + 默认 GUI（浏览器回退版）：纯 Go，三平台交叉编译
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - name: vet
        run: go vet ./...

      # 版本号：打标签用标签名，否则用短 SHA（同一提交的多个作业算出的值一致，避免两作业各自取时间戳撞号）
      - name: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      # 每平台打一个 zip（与参考项目同形）：zip 名唯一，发 Release 时不会撞名互相覆盖
      - name: build
        run: |
          set -euo pipefail
          mkdir -p dist
          pack() { # $1=os $2=arch
            dir="dist/$1-$2"
            mkdir -p "$dir"
            ext=""
            [ "$1" = "windows" ] && ext=".exe"
            for c in server login; do
              GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
                -ldflags="-s -w -X main.appVersion=${VERSION}" \
                -o "$dir/deveco2api-$c$ext" "./cmd/$c"
            done
            # GUI 默认构建（无 webview tag）：用系统浏览器打开登录页，无 cgo 依赖
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
              -o "$dir/deveco2api-gui$ext" ./cmd/login-gui
            cp config.example.json README.md "$dir/"
            python3 -c 'import os,sys,zipfile;n,d=sys.argv[1:];z=zipfile.ZipFile(n,"w",zipfile.ZIP_DEFLATED);[z.write(os.path.join(d,f),f) for f in os.listdir(d)];z.close()' \
              "dist/deveco2api-${VERSION}-$1-$2.zip" "$dir"
          }
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              pack "$os" "$arch"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: dist/*.zip

      # 用 runner 自带的 gh 发版（与参考项目一致）：不再引第三方 release action
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" dist/*.zip --title "v${VERSION}" --generate-notes

  # 增量产物：内嵌 webview 版 GUI（-tags webview）。cgo 不能交叉编译，
  # 只能在各自 runner 上原生构建：Linux 装 WebKitGTK，macOS 用 WKWebView，Windows 用 WebView2。
  gui-webview:
    # 串行在 core 之后：GUI 二进制也要作为 Release 资产，而 Release 由 core 创建
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            deps: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
            # Ubuntu 24.04 只有 webkit2gtk-4.1，脚本会补 4.0 的 pkg-config 别名
            build: bash scripts/build-gui.sh dist/gui/deveco2api-gui
          - os: macos-latest
            arch: arm64
            deps: "true"
            build: go build -tags webview -trimpath -ldflags="-s -w" -o dist/gui/deveco2api-gui ./cmd/login-gui
          - os: windows-latest
            arch: amd64
            deps: "true"
            build: go build -tags webview -trimpath -ldflags="-s -w" -o dist/gui/deveco2api-gui.exe ./cmd/login-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi
        shell: bash
      - name: deps
        run: ${{ matrix.deps }}
      - name: build
        run: ${{ matrix.build }}
      - name: zip
        run: |
          set -euo pipefail
          python3 -c 'import os,sys,zipfile;n,d=sys.argv[1:];z=zipfile.ZipFile(n,"w",zipfile.ZIP_DEFLATED);[z.write(os.path.join(d,f),f) for f in os.listdir(d)];z.close()' \
            "dist/deveco2api-gui-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip" dist/gui
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: gui-webview-${{ matrix.os }}
          path: dist/deveco2api-gui-*.zip
      # 追加到 core 建好的 Release（--clobber 保证重跑幂等）
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" dist/deveco2api-gui-*.zip --clobber
        shell: bash
